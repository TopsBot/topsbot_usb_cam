# pixel_format=mjpeg2nv12 — mjpeg2nv12_1280x720_sensor.yaml
#
# 用于 segformer 硬件加速视频链路。
# 原因：ta_cv_image_csc_convert_to 只支持缩小（downscale），约束
# crop_width >= resize_out_width。segformer 输入为 1024x512，640x480
# 摄像头需「放大」会触发 "Resize_attr is illegal"，故改用 1280x720
# （1280x720 -> 1024x512 为缩小，满足硬件约束）。

/**:
  ros__parameters:
    video_device: "/dev/video0"
    image_width: 1280
    image_height: 720
    framerate: 15
    io_method: "mmap"
    av_device_format: "YUV422P"
    pixel_format: "mjpeg2nv12"
    zero_copy: false
    frame_id: "usb_cam"
    camera_name: "test_camera"
    camera_info_url: "package://topsbot_usb_cam/config/camera_info.yaml"
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    auto_white_balance: true
    white_balance: 4000
    autoexposure: true
    exposure: 100
    autofocus: false
    focus: -1